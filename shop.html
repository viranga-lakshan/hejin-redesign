<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shop · HEJIN هجين</title>
<meta name="description" content="Shop HEJIN handcrafted camel-leather handbags, wallets, backpacks and accessories from Riyadh.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300&family=Manrope:wght@400;500;600;700&family=Amiri:wght@400;700&family=Noto+Kufi+Arabic:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/site.css">
</head>
<body data-page="shop">
<main id="main" class="inner">
  <section class="shop-head"><div class="wrap">
    <p class="eyebrow" data-i18n="shop"></p>
    <h1 id="shopTitle"></h1>
    <p id="shopSub"></p>
  </div></section>
  <div class="wrap shop-layout">
    <aside class="filters" aria-label="Filters">
      <div class="fg srch"><input id="shopQ" type="search" data-i18n-ph="searchPh" aria-label="Search"></div>
      <div class="fg cats"><h4 data-i18n="byCat"></h4><div class="opts" id="fCats"></div></div>
      <div class="fg"><h4 data-i18n="byCol"></h4><div class="opts" id="fCols"></div></div>
      <div class="fg"><h4 data-i18n="sh_price"></h4><select id="fPrice" aria-label="Price"></select></div>
    </aside>
    <section>
      <div class="sortbar"><span class="cnt" id="cnt"></span><select id="fSort" aria-label="Sort"></select></div>
      <div class="grid" id="grid"></div>
    </section>
  </div>
</main>
<script src="js/data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<script src="js/app.js"></script>
<script src="js/shop.js"></script>
</body>
</html>
